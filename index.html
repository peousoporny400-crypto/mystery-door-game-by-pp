<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Mystery Door Game - Play Online</title>
  <meta name="description" content="Play the free Mystery Door web game! Pick between mystery doors to find hidden treasure or face the ghost.">
  <meta name="keywords" content="Mystery Door Game, Python game, web game, play online">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🚪 Mystery Door Game 🚪</h1>
  <p id="instruction">Choose a difficulty and pick a door!</p>

  <!-- Difficulty Selector Buttons -->
  <div class="difficulty-container">
    <button class="diff-btn active" onclick="setDifficulty(3, this)">Easy (3 Doors)</button>
    <button class="diff-btn" onclick="setDifficulty(5, this)">Medium (5 Doors)</button>
    <button class="diff-btn" onclick="setDifficulty(10, this)">Hard (10 Doors)</button>
  </div>

  <div class="score-board">
    <span>Wins: <strong id="wins">0</strong></span>
    <span>Losses: <strong id="losses">0</strong></span>
  </div>

  <!-- Dynamic Doors Layout -->
  <div class="doors-container" id="doors-container"></div>

  <div id="result-message"></div>

  <button id="reset-btn" onclick="resetGame()" style="display: none;">Play Again</button>

  <script>
    let totalDoors = 3;
    let winningDoor = 1;
    let wins = 0;
    let losses = 0;
    let gameOver = false;

    // The different things that can be behind the doors
    const treasureEmoji = '🏆'; // Winner
    const ghostEmoji = '👻';    // Loser
    
    // Funny/Strange things behind "empty" doors
    const randomConsolationEmojis = [
        '🧸', '🌮', '💩', '🕶️', '🦄', '🧟', '🛹', '🍕', '💩', '🦖', '🎈', '💸'
    ];

    // Web Audio Context for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Play retro win sound effect
    function playWinSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime + 0.1); // D5
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2); // A5
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // Play retro lose sound effect
    function playLoseSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    // Play door click sound effect
    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
      
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    window.onload = function() {
      resetGame();
    };

    function setDifficulty(numDoors, buttonElement) {
      playClickSound();
      totalDoors = numDoors;
      
      const buttons = document.querySelectorAll('.diff-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      buttonElement.classList.add('active');

      resetGame();
    }

    // Help function to get a random item that is NOT the main winning item or the ghost
    function getRandomConsolationItem() {
        const randomIndex = Math.floor(Math.random() * randomConsolationEmojis.length);
        return randomConsolationEmojis[randomIndex];
    }

    function createDoors() {
      const container = document.getElementById('doors-container');
      container.innerHTML = '';

      for (let i = 1; i <= totalDoors; i++) {
        // Create the outer door button
        const doorBtn = document.createElement('button');
        doorBtn.className = 'door closed';
        doorBtn.onclick = function() { chooseDoor(i); };

        // Create the container for the hidden content
        const contentDiv = document.createElement('div');
        contentDiv.className = 'hidden-content';
        
        // Decide what is behind this specific door
        let hiddenItem = '';
        if (i === winningDoor) {
            hiddenItem = treasureEmoji; // Set the treasure
            contentDiv.classList.add('is-treasure');
        } else if (i === (winningDoor % totalDoors) + 1) { // Pick one door near winningDoor for the ghost
            hiddenItem = ghostEmoji; // Set the ghost
            contentDiv.classList.add('is-ghost');
        } else {
            hiddenItem = getRandomConsolationItem(); // Set a funny consolation item
            contentDiv.classList.add('is-consolation');
        }
        
        // Create the visual emoji element
        const emojiP = document.createElement('p');
        emojiP.className = 'door-emoji';
        emojiP.innerText = hiddenItem;
        contentDiv.appendChild(emojiP);
        
        // Add hidden content to the door, and door to container
        doorBtn.appendChild(contentDiv);
        
        // The visible 'door number' text on top
        const doorLabel = document.createElement('span');
        doorLabel.className = 'door-label';
        doorLabel.innerHTML = `Door<br>${i}`;
        doorBtn.appendChild(doorLabel);
        
        container.appendChild(doorBtn);
      }
    }

    function chooseDoor(doorNumber) {
      if (gameOver) return;

      const resultDiv = document.getElementById('result-message');
      const resetBtn = document.getElementById('reset-btn');
      
      const allDoors = document.querySelectorAll('.door');
      const selectedDoor = allDoors[doorNumber - 1]; // Index is 0-based

      // Reveal ONLY the selected door instantly
      selectedDoor.classList.remove('closed');
      selectedDoor.classList.add('open');

      if (doorNumber === winningDoor) {
        playWinSound();
        resultDiv.innerHTML = `🏆 **Amaze-balls! You found the 🏆 treasure behind Door ${doorNumber}!**`;
        resultDiv.className = "win";
        wins++;
        document.getElementById('wins').innerText = wins;
      } else {
        playLoseSound();
        
        // See if we opened the ghost
        if (selectedDoor.querySelector('.hidden-content').classList.contains('is-ghost')) {
            resultDiv.innerHTML = `👻 **EEK! You unleashed a 👻 ghost from behind Door ${doorNumber}!** <br> Treasure was behind Door ${winningDoor}.`;
        } else {
            const foundItem = selectedDoor.querySelector('.door-emoji').innerText;
            resultDiv.innerHTML = `...Wait. There's just a ${foundItem} here? <br> Treasure was behind Door ${winningDoor}.`;
        }
        
        resultDiv.className = "lose";
        losses++;
        document.getElementById('losses').innerText = losses;
      }

      gameOver = true;
      resetBtn.style.display = 'inline-block';
      
      // OPTIONAL: Reveal ALL remaining doors after 1.5 seconds so player sees what they missed
      setTimeout(() => {
          allDoors.forEach((door) => {
              door.classList.remove('closed');
              door.classList.add('open');
          });
      }, 1500);
    }

    function resetGame() {
      winningDoor = Math.floor(Math.random() * totalDoors) + 1;
      gameOver = false;
      document.getElementById('result-message').innerHTML = '';
      document.getElementById('result-message').className = '';
      document.getElementById('reset-btn').style.display = 'none';
      createDoors();
    }
  </script>
</body>
</html>
